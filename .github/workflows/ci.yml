name: CI

# Runs both test suites and a production build.
# No deployment happens here — this workflow only reports pass or fail.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — test and build
    runs-on: ubuntu-latest

    # The project is a monorepo with no package.json at the root,
    # so every npm command runs inside the package it belongs to.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend — test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Covers the search logic: Hebrew stem derivation, relevance scoring and
      # the three-level sort. There is no build step, since the cloud functions
      # are deployed from source.
      - name: Run tests
        run: npm test
